name: Android build

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      LYVRA_VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.LYVRA_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (installable, for testing)
        run: ./gradlew --no-daemon assembleDebug

      - name: Restore release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lyvra.jks"

      - name: Build signed release APK and AAB
        if: env.KEYSTORE_BASE64 != ''
        env:
          LYVRA_KEYSTORE: ${{ runner.temp }}/lyvra.jks
          LYVRA_KEYSTORE_PASSWORD: ${{ secrets.LYVRA_KEYSTORE_PASSWORD }}
          LYVRA_KEY_ALIAS: ${{ secrets.LYVRA_KEY_ALIAS }}
          LYVRA_KEY_PASSWORD: ${{ secrets.LYVRA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: lyvra-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: lyvra-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
